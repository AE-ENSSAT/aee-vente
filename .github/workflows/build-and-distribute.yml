# Builds signed RELEASE artifacts for both platforms on every push to main and
# uploads them to Firebase App Distribution.
#
# Runs entirely on FREE, standard GitHub-hosted runners (ubuntu + macOS are free and
# unlimited on public repos). ios/ and android/ are gitignored (Expo CNG), so each job
# runs `expo prebuild` first. See docs/CI.md for the one-time setup and secrets list.

name: Build & Distribute

on:
    push:
        branches: [main]
    workflow_dispatch:

# A newer push to main cancels an in-flight run for the same ref.
concurrency:
    group: build-distribute-${{ github.ref }}
    cancel-in-progress: true

jobs:
    android:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17
            - uses: gradle/actions/setup-gradle@v4

            - name: Cache node_modules
              uses: actions/cache@v4
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock') }}

            - name: Install JS dependencies
              run: bun install --frozen-lockfile

            - name: Prebuild (Android)
              env:
                  SUMUP_AFFILIATE_KEY: ${{ secrets.SUMUP_AFFILIATE_KEY }}
                  SUMUP_ACCESS_TOKEN: ${{ secrets.SUMUP_ACCESS_TOKEN }}
                  SUMUP_MAVEN_USER: ${{ secrets.SUMUP_MAVEN_USER }}
                  SUMUP_MAVEN_PASSWORD: ${{ secrets.SUMUP_MAVEN_PASSWORD }}
                  BUILD_NUMBER: ${{ github.run_number }}
              run: bunx expo prebuild --platform android --clean --no-install

            - name: Decode upload keystore
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload.keystore

            - name: Assemble release APK
              working-directory: android
              env:
                  SUMUP_MAVEN_USER: ${{ secrets.SUMUP_MAVEN_USER }}
                  SUMUP_MAVEN_PASSWORD: ${{ secrets.SUMUP_MAVEN_PASSWORD }}
                  # Consumed by plugin/withAndroidSigning.js via Gradle properties.
                  ORG_GRADLE_PROJECT_AEE_UPLOAD_STORE_FILE: upload.keystore
                  ORG_GRADLE_PROJECT_AEE_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ORG_GRADLE_PROJECT_AEE_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ORG_GRADLE_PROJECT_AEE_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: ./gradlew :app:assembleRelease --no-daemon

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: aee-vente-android
                  path: android/app/build/outputs/apk/release/app-release.apk
                  if-no-files-found: error

            - name: Distribute to Firebase App Distribution
              uses: wzieba/Firebase-Distribution-Github-Action@v1
              with:
                  appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
                  serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  groups: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
                  file: android/app/build/outputs/apk/release/app-release.apk
                  releaseNotes: "main ${{ github.sha }} (run ${{ github.run_number }})"

    ios:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Cache node_modules
              uses: actions/cache@v4
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock') }}

            - name: Cache CocoaPods
              uses: actions/cache@v4
              with:
                  path: |
                      ~/Library/Caches/CocoaPods
                      ~/.cocoapods
                  key: ${{ runner.os }}-pods-${{ hashFiles('bun.lock') }}

            - name: Install JS dependencies
              run: bun install --frozen-lockfile

            - name: Import signing certificate
              uses: apple-actions/import-codesign-certs@v3
              with:
                  p12-file-base64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
                  p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

            - name: Install provisioning profile
              env:
                  IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
              run: |
                  PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
                  mkdir -p "$PROFILES_DIR"
                  echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/aee.mobileprovision"

            - name: Prebuild (iOS)
              env:
                  SUMUP_AFFILIATE_KEY: ${{ secrets.SUMUP_AFFILIATE_KEY }}
                  SUMUP_ACCESS_TOKEN: ${{ secrets.SUMUP_ACCESS_TOKEN }}
                  BUILD_NUMBER: ${{ github.run_number }}
              run: bunx expo prebuild --platform ios --clean

            - name: Build & export IPA
              id: build
              env:
                  IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
                  IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
              run: |
                  set -euo pipefail
                  WORKSPACE=$(ls ios/*.xcworkspace | head -1)
                  SCHEME=$(basename "$WORKSPACE" .xcworkspace)
                  echo "Workspace: $WORKSPACE  Scheme: $SCHEME"

                  # ExportOptions.plist (ad-hoc / release-testing, manual signing).
                  # Heredoc body + terminator sit at the block's base indent, so YAML
                  # strips it and the plist lands column-aligned for the shell.
                  cat > ios/ExportOptions.plist <<PLIST
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                  <key>method</key>
                  <string>release-testing</string>
                  <key>teamID</key>
                  <string>${IOS_TEAM_ID}</string>
                  <key>signingStyle</key>
                  <string>manual</string>
                  <key>provisioningProfiles</key>
                  <dict>
                  <key>bzh.aee.vente</key>
                  <string>${IOS_PROFILE_NAME}</string>
                  </dict>
                  <key>compileBitcode</key>
                  <false/>
                  </dict>
                  </plist>
                  PLIST

                  xcodebuild archive \
                      -workspace "$WORKSPACE" \
                      -scheme "$SCHEME" \
                      -configuration Release \
                      -destination 'generic/platform=iOS' \
                      -archivePath "$RUNNER_TEMP/app.xcarchive" \
                      CODE_SIGN_STYLE=Manual \
                      DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
                      PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME"

                  xcodebuild -exportArchive \
                      -archivePath "$RUNNER_TEMP/app.xcarchive" \
                      -exportOptionsPlist ios/ExportOptions.plist \
                      -exportPath "$RUNNER_TEMP/export"

                  IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
                  echo "ipa_path=$IPA" >> "$GITHUB_OUTPUT"

            - name: Upload IPA artifact
              uses: actions/upload-artifact@v4
              with:
                  name: aee-vente-ios
                  path: ${{ steps.build.outputs.ipa_path }}
                  if-no-files-found: error

            - name: Distribute to Firebase App Distribution
              uses: wzieba/Firebase-Distribution-Github-Action@v1
              with:
                  appId: ${{ secrets.FIREBASE_APP_ID_IOS }}
                  serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  groups: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
                  file: ${{ steps.build.outputs.ipa_path }}
                  releaseNotes: "main ${{ github.sha }} (run ${{ github.run_number }})"
